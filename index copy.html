<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider Responsivo</title>

<style>
  .slider {
    width: 100%;
    max-width: 600px; /* opcional */
    overflow: hidden;
    position: relative;
    margin: 40px auto;
  }

  .slides {
    display: flex;
    gap: 10px;
    transition: transform 0.4s ease;
  }

  .slides img {
    width: calc(50% - 5px); /* ✅ 2 imagens por vez */
    object-fit: cover;
    border-radius: 8px;
  }

  .prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #00000080;
    color: #fff;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 20px;
  }

  .prev { left: 10px; }
  .next { right: 10px; }

  /* ✅ RESPONSIVO PARA TELEMÓVEL */
  @media (max-width: 600px) {
    .slides img {
      width: 100%; /* mostra 1 imagem por vez */
    }
  }
</style>

</head>
<body>

<div class="slider">
  <div class="slides">
    <img src="https://picsum.photos/seed/a/600/400" alt="">
    <img src="https://picsum.photos/seed/b/600/400" alt="">
    <img src="https://picsum.photos/seed/c/600/400" alt="">
    <img src="https://picsum.photos/seed/d/600/400" alt="">
  </div>

  <button class="prev">◀</button>
  <button class="next">▶</button>
</div>

<script>
  let index = 0;
  const slides = document.querySelector(".slides");
  const total = document.querySelectorAll(".slides img").length;

  function updateSlide() {
    const isMobile = window.innerWidth <= 600;
    const visible = isMobile ? 1 : 2;
    const move = isMobile ? 100 : 50;
    slides.style.transform = `translateX(-${index * move}%)`;
    return visible;
  }

  document.querySelector(".next").onclick = () => {
    const visible = updateSlide();
    if (index < total - visible) {
      index++;
      updateSlide();
    }
  };

  document.querySelector(".prev").onclick = () => {
    if (index > 0) {
      index--;
      updateSlide();
    }
  };

  window.addEventListener("resize", updateSlide);
  updateSlide();
</script>

</body>
</html>
