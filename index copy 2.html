<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Menu estilo imagem</title>

<style>
  nav {
    display: flex;
    gap: 60px; /* espaço entre os itens */
    justify-content: center;
    padding: 20px 0;
    font-family: Arial, sans-serif;
  }

  nav a {
    text-decoration: none;
    color: black;
    font-weight: bold;
    padding-bottom: 5px;
    position: relative;
  }

  /* Estilo do item ativo */
  nav a.active {
    color: #0066ff; /* azul igual da imagem */
  }

  /* Linha vermelha embaixo do ativo */
  nav a.active::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -3px; 
    width: 40px;   /* largura igual da imagem */
    height: 3px;
    background: red;
    border-radius: 2px;
  }
</style>

</head>
<body>

<nav>
  <a href="#home" class="active">Home</a>
  <a href="#sobre">Sobre</a>
  <a href="#servicos">Serviços</a>
  <a href="#contato">Contato</a>
</nav>

</body>
</html>
